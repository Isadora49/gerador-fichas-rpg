<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editor de Fichas RPG No-Code</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #1a1a1a; color: white; overflow: hidden; }
        #toolbar { padding: 15px; background: #222; border-bottom: 2px solid #e74c3c; display: flex; gap: 15px; align-items: center; z-index: 1000; flex-wrap: wrap; }
        #viewer-container { flex: 1; overflow: auto; position: relative; background: #333; display: flex; justify-content: center; }
        #canvas-wrapper { position: relative; margin: 20px; }
        canvas { border: 1px solid #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; }
        
        button { background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ff5e4d; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-add { background: #27ae60; }
        .btn-add:hover { background: #2ecc71; }

        /* Marcador Interativo */
        .marker {
            position: absolute;
            background: rgba(231, 76, 60, 0.7);
            border: 2px solid #e74c3c;
            color: white;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: move;
            resize: both;
            overflow: visible;
            min-width: 40px;
            min-height: 20px;
            user-select: none;
            z-index: 500;
        }

        /* Botão de deletar dentro do campo */
        .btn-del {
            position: absolute;
            top: -10px;
            right: -10px;
            background: black;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid white;
        }

        .label-text { pointer-events: none; padding: 2px; text-shadow: 1px 1px 2px black; }
        
        #status { font-size: 0.9em; color: #ccc; }
    </style>
</head>
<body>

<div id="toolbar">
    <input type="file" id="uploadPdf" accept="application/pdf">
    <button id="btnAddField" class="btn-add">➕ NOVO CAMPO</button>
    <button id="btnDownload" disabled>BAIXAR PDF CONFIGURADO</button>
    <div id="status">Aguardando PDF...</div>
</div>

<div id="viewer-container">
    <div id="canvas-wrapper">
        <canvas id="pdf-canvas"></canvas>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
